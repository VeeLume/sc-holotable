[package]
name = "sc-missions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Every sc-extract feature this crate's code actually reaches. Update
# whenever a new walk lands. The aggregation crate owns its feature
# closure so narrow consumers can depend on `sc-missions` alone and
# get fully-populated pools without manually enabling features.
#
#   contracts            ContractGenerator / ContractGeneratorHandler*
#   servicebeacon        StarMapObject (LocationRegistry)
#   entityclassdefinition  EntityClassDefinition (ShipRegistry,
#                          RewardCurrencyCatalog, BlueprintPoolRegistry
#                          item resolution). Without this, ECD records
#                          are not decoded at parse time and the
#                          registries silently come back empty — the
#                          "data just wasn't there" failure mode.
#   reputation             FactionReputation + SReputationStandingParams —
#                          the mission faction (giver/gating rep) and the
#                          rep-prerequisite standing tiers.
sc-extract = { workspace = true, features = ["contracts", "servicebeacon", "entities-scitem", "reputation", "missiondata", "missionbroker", "entities-objectcontainers", "entities-objectcontainerrotating", "entities-rastar", "entities-spaceships", "entities-missionlocationtemplate", "entities-missionlocationmanager", "entities-locationmanager", "entities-locationtemplate", "entities-baselocationtemplate"] }
sc-crafting = { workspace = true }
sc-items = { workspace = true }
# Typed StarMapObject surface (LocationKind + hierarchy + jurisdiction) — the
# richer replacement for the bespoke parent-walk in locality.rs. Brings the
# `starmap` sc-extract feature with it.
sc-locations = { workspace = true }
sc-tags = { workspace = true }
svarog-common = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# `tui` feature: pulls SuperLightTUI for the explorer view. Opt-in so
# consumers that only want contract data don't pay for the SLT dep.
superlighttui = { workspace = true, optional = true }

[dev-dependencies]
sc-discovery = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
tui = ["dep:superlighttui"]
# Payout estimation: pulls the `gamemode` pools so `UecCurve` can read
# GameMode.SC_Default.subsumptionMissionModule.uecCurve.
payout = ["sc-extract/gamemode"]

# Examples that use the payout API only build when the feature is on.
[[example]]
name = "uec_validate"
required-features = ["payout"]
