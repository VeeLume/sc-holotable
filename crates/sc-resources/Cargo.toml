[package]
name = "sc-resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `resourcetypedatabase` decodes the ResourceType record type this crate walks.
# `crafting` gates the standalone quality records (`CraftingQuality*Record`):
# quality is an intrinsic ResourceType property modelled here (`quality.rs`),
# even though CIG's record names are crafting-prefixed.
sc-extract = { workspace = true, features = ["resourcetypedatabase", "crafting"] }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-discovery = { workspace = true }
serde_json = { workspace = true }
