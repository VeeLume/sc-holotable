[package]
name = "sc-acquisitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Domain crate: how a player comes by an item or a vehicle. It joins the
# indices that hold the sources (vehicles, crafting and mission blueprint
# rewards today; item rewards, loot and NPC spawns as they land), so it needs
# no sc-extract leaf feature of its own.
sc-crafting = { workspace = true }
sc-extract = { workspace = true }
sc-missions = { workspace = true }
sc-vehicles = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-discovery = { workspace = true }
sc-items = { workspace = true }
