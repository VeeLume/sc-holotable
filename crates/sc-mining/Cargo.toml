[package]
name = "sc-mining"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Domain crate: the rock side of mining and its maths. Rulesets
# (`MiningGlobalParams`) and elements (`MineableElement`) are typed `mining`
# records; densities join through sc-resources; laser, module and gadget
# stats come from the two item crates.
sc-extract = { workspace = true, features = ["mining", "resourcetypedatabase"] }
sc-resources = { workspace = true }
sc-items-mining = { workspace = true }
sc-items-ship-weapons = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-discovery = { workspace = true }
sc-items = { workspace = true }
