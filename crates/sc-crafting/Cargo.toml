[package]
name = "sc-crafting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `crafting` decodes the BlueprintPoolRecord / CraftingBlueprintRecord /
# CraftingProcess record types this crate walks. sc-items resolves the
# crafted entity's display name (its feature flows in transitively).
# sc-resources contributes CargoQuantity + Resource (for Cost_Resource
# quantity projection + downstream resource lookup).
sc-extract = { workspace = true, features = ["crafting"] }
sc-items = { workspace = true }
# Integrator: sc-crafting owns the GPP -> stat mapping and produces finished
# product stats, so it depends on the per-domain base-stat crates.
sc-items-armor = { workspace = true }
sc-items-fps-weapons = { workspace = true }
sc-items-ship-components = { workspace = true }
sc-items-ship-weapons = { workspace = true }
sc-resources = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-discovery = { workspace = true }
serde_json = { workspace = true }
