[package]
name = "sc-holotable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Umbrella prelude crate — the recommended public dependency. Re-exports the
# typed surfaces of every workspace crate behind feature flags so downstream
# consumers pin one tag, name no svarog rev, and pick capabilities with
# features instead of remembering sc-extract leaf flags. See
# `docs/workspace-structure.md` -> "Umbrella crate".
#
# NOTE: only the crates that exist today are wired up. The full feature map in
# the design doc (sc-vehicles, sc-loadouts, sc-economy, ...) lands as those
# crates do.

[dependencies]
sc-discovery = { workspace = true, optional = true }
sc-extract = { workspace = true, optional = true }
sc-items = { workspace = true, optional = true }
sc-items-armor = { workspace = true, optional = true }
sc-items-fps-weapons = { workspace = true, optional = true }
sc-items-ship-components = { workspace = true, optional = true }
sc-items-ship-weapons = { workspace = true, optional = true }
sc-locations = { workspace = true, optional = true }
sc-tags = { workspace = true, optional = true }
sc-manufacturers = { workspace = true, optional = true }
sc-resources = { workspace = true, optional = true }
sc-weapons = { workspace = true, optional = true }
sc-crafting = { workspace = true, optional = true }
sc-gathering = { workspace = true, optional = true }
sc-missions = { workspace = true, optional = true }
serde = { workspace = true }

[features]
default = []

# ── Per-crate surfaces ───────────────────────────────────────────────────────
installs = ["dep:sc-discovery"]
extract = ["dep:sc-extract"]
items = ["dep:sc-items", "extract"]
locations = ["dep:sc-locations", "extract"]
tags = ["dep:sc-tags", "extract"]
manufacturers = ["dep:sc-manufacturers", "extract"]
resources = ["dep:sc-resources", "extract"]
# Leaf crates self-enable the sc-extract leaf features they need (sc-weapons →
# entities-scitem-weapons/ammoparams, sc-crafting → crafting), so the umbrella
# only needs to pull the crate itself.
weapons = ["dep:sc-weapons", "extract", "items"]
# T1 per-itemtype base-stat sheets. The crafting product-stats API consumes
# them, so `crafting` enables these surfaces too.
fps-weapons = ["dep:sc-items-fps-weapons", "extract", "items"]
armor = ["dep:sc-items-armor", "extract", "items"]
ship-components = ["dep:sc-items-ship-components", "extract", "items"]
ship-weapons = ["dep:sc-items-ship-weapons", "extract", "items"]
crafting = ["dep:sc-crafting", "extract", "items", "resources", "fps-weapons", "armor", "ship-components", "ship-weapons"]
# sc-gathering self-enables its sc-extract leaf features (harvestable / mining /
# entities-mineable); the umbrella pulls the crate + the location surface it joins.
gathering = ["dep:sc-gathering", "extract", "locations"]
missions = ["dep:sc-missions", "extract", "items", "tags"]
# Payout estimation on top of `missions`: passes through sc-missions' `payout`
# feature (UecCurve / Mission::estimate_uec), which pulls the `gamemode`
# sc-extract pools to read GameMode.SC_Default's uecCurve. Kept separate from
# `missions` so contract-only consumers don't pay the gamemode extract cost.
missions-payout = ["missions", "sc-missions/payout"]

# ── Cross-cutting ────────────────────────────────────────────────────────────
# The coordination build-context + HolotableSnapshot need every foundational
# index, so they're gated on having them all.
foundations = ["extract", "items", "tags", "manufacturers", "resources", "locations", "gathering"]

# ── Aggregators ──────────────────────────────────────────────────────────────
all-t1 = ["installs", "items", "locations", "tags", "manufacturers", "resources", "weapons", "fps-weapons", "armor", "ship-components", "ship-weapons", "crafting", "gathering", "foundations"]
full = ["all-t1", "missions-payout"]

[dev-dependencies]
tempfile = "3"

# The example exercises every feature surface, so it only builds under `full`.
# Without this, `cargo check --all-targets` (default features) would try to
# compile it with nothing enabled and fail.
[[example]]
name = "foundations_snapshot"
required-features = ["full"]
