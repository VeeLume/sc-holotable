[package]
name = "sc-items-ship-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# T1 data crate: ship-component base-stat sheet (integrity, quantum drive
# speed/fuel, shield HP/regen, cooler/power-plant generation). Classification
# via sc-items (EItemType); the flat crafting stats are read through the raw
# `Datacore::db()` layer, the per-kind sheets (shield, emitter, armour,
# quantum drive, thruster, health) through the typed surface:
#   entities-scitem   the ship-item EntityClassDefinitions
sc-extract = { workspace = true, features = ["entities-scitem"] }
sc-items = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-discovery = { workspace = true }
