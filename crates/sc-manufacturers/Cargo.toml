[package]
name = "sc-manufacturers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `scitemmanufacturer` decodes the SCItemManufacturer record type this
# crate's typed walk reads — sc-manufacturers owns its feature closure.
sc-extract = { workspace = true, features = ["scitemmanufacturer"] }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sc-installs = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
